[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensu-mcp-server"
version = "0.1.0"
description = "A read-only MCP server for Sensu monitoring and alerting"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastmcp>=2.14.0,<3",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
sensu-mcp = "sensu_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["sensu_mcp_server"]
